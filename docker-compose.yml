services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres   # default db; init.sql creates the three service dbs
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shiptrack-net

  # ── Identity Service ────────────────────────────────────────────────────────
  identity:
    build:
      context: .
      dockerfile: src/services/Identity.Api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
      AdminEmail: ${ADMIN_EMAIL}
      AdminPassword: ${ADMIN_PASSWORD}
      ConnectionStrings__DefaultConnection: >-
        Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${IDENTITY_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080; printf \"GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \" 200 \" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - shiptrack-net

  # ── Inventory Service ───────────────────────────────────────────────────────
  inventory:
    build:
      context: .
      dockerfile: src/services/Inventory.Api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      InternalKey__Value: ${INVENTORY_INTERNAL_KEY}
      ConnectionStrings__DefaultConnection: >-
        Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${INVENTORY_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080; printf \"GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \" 200 \" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - shiptrack-net

  # ── Orders Service ──────────────────────────────────────────────────────────
  orders:
    build:
      context: .
      dockerfile: src/services/Orders.Api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      ConnectionStrings__DefaultConnection: >-
        Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${ORDERS_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      InventoryService__BaseUrl: ${INVENTORY_INTERNAL_URL}
      InventoryService__InternalKey: ${INVENTORY_INTERNAL_KEY}
    ports:
      - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy
      inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080; printf \"GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \" 200 \" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - shiptrack-net

  # ── YARP Gateway ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: src/gateway/Gateway/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address: ${IDENTITY_INTERNAL_URL}
      ReverseProxy__Clusters__inventory-cluster__Destinations__destination1__Address: ${INVENTORY_INTERNAL_URL_GATEWAY}
      ReverseProxy__Clusters__orders-cluster__Destinations__destination1__Address: ${ORDERS_INTERNAL_URL}
    ports:
      - "8080:8080"
    depends_on:
      identity:
        condition: service_healthy
      inventory:
        condition: service_healthy
      orders:
        condition: service_healthy
    networks:
      - shiptrack-net

  # ── React Frontend ──────────────────────────────────────────────────────────
  web:
    # The frontend is enabled in the frontend phase. Until src/web exists,
    # backend services can be started with the default Compose profile.
    profiles: ["frontend"]
    build:
      context: .
      dockerfile: src/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - shiptrack-net

volumes:
  postgres_data:

networks:
  shiptrack-net:
    driver: bridge
