services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres   # default db; init.sql creates the three service dbs
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shiptrack-net

  # ── Identity Service ────────────────────────────────────────────────────────
  identity:
    build:
      context: ./src/services/Identity.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${IDENTITY_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - shiptrack-net

  # ── Inventory Service ───────────────────────────────────────────────────────
  inventory:
    build:
      context: ./src/services/Inventory.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${INVENTORY_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - shiptrack-net

  # ── Orders Service ──────────────────────────────────────────────────────────
  orders:
    build:
      context: ./src/services/Orders.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${ORDERS_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      InventoryService__BaseUrl: ${INVENTORY_INTERNAL_URL}
      InventoryService__InternalKey: ${INVENTORY_INTERNAL_KEY}
    ports:
      - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy
      inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - shiptrack-net

  # ── YARP Gateway ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./src/gateway/Gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address: ${IDENTITY_INTERNAL_URL}
      ReverseProxy__Clusters__inventory-cluster__Destinations__destination1__Address: ${INVENTORY_INTERNAL_URL_GATEWAY}
      ReverseProxy__Clusters__orders-cluster__Destinations__destination1__Address: ${ORDERS_INTERNAL_URL}
    ports:
      - "8080:8080"
    depends_on:
      identity:
        condition: service_healthy
      inventory:
        condition: service_healthy
      orders:
        condition: service_healthy
    networks:
      - shiptrack-net

  # ── React Frontend ──────────────────────────────────────────────────────────
  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - shiptrack-net

volumes:
  postgres_data:

networks:
  shiptrack-net:
    driver: bridge
